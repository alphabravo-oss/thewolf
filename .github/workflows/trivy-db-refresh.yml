# Refresh the 8-day Trivy DB digest locks before go.yml scanners-validate goes red.
# The factory's manual refresh-vulnerability-dbs job only uploads a proposal
# artifact. This workflow commits the locks and opens a PR.
name: Trivy DB lock refresh

on:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trivy-db-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Refresh Trivy DB locks
        run: make scanners-vulnerability-dbs-refresh

      - name: Open PR when locks change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add scanners/quality/trivy-db.lock.json \
            scanners/quality/trivy-java-db.lock.json \
            scanners/scanner-lock.yaml \
            internal/scannerbuild/context
          if git diff --cached --quiet; then
            echo "locks already current"
            exit 0
          fi
          branch="chore/trivy-db-refresh-$(date -u +%Y%m%d)"
          git config user.name "wolf-factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "chore: refresh Trivy vulnerability DB locks"
          git push -u origin "$branch"
          gh pr create --fill --head "$branch" --title "chore: refresh Trivy vulnerability DB locks" --body "Scheduled refresh of \`trivy-db:2\` and \`trivy-java-db:1\` digest locks (8-day validity). Generated by \`.github/workflows/trivy-db-refresh.yml\`." || true
