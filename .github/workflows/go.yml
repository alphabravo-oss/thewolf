# Build + test the wolf Go module on every push and PR.
name: Go

# Least-privilege default — jobs that need write access can opt in
# at the job level. Satisfies Checkov CKV2_GHA_1 / KICS GHA-perms.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: public core must not import Enterprise
        run: |
          if grep -R --include='*.go' -n 'github.com/alphabravocompany/wolf-enterprise' .; then
            echo "Community core must not import wolf-enterprise" >&2
            exit 1
          fi

      - name: license hygiene
        run: |
          test -f LICENSE_POLICY.md
          test -f NOTICE
          test -f CONTRIBUTING.md
          grep -q '53 scanners' README.md
          if grep -Eiq 'open source|proprietary' README.md; then
            echo "README must not call Community OSI open source or proprietary" >&2
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: scanner metadata validation
        run: make scanners-validate

      - name: go test (unit, no integration)
        run: go test -race -count=1 -timeout 120s ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.12.2
