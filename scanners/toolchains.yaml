# Scanner image toolchain metadata.
#
# Tool versions live in tools.yaml + versions.env. This file tracks the
# language/runtime toolchains and base images that scanner builds depend on.
base_images:
  default: debian:trixie-slim@sha256:4e401d95de7083948053197a9c3913343cd06b706bf15eb6a0c3ccd26f436a0e
  jvm: debian:trixie-slim@sha256:4e401d95de7083948053197a9c3913343cd06b706bf15eb6a0c3ccd26f436a0e
  rust: debian:trixie-slim@sha256:4e401d95de7083948053197a9c3913343cd06b706bf15eb6a0c3ccd26f436a0e
  codeql: debian:trixie-slim@sha256:4e401d95de7083948053197a9c3913343cd06b706bf15eb6a0c3ccd26f436a0e

toolchains:
  go:
    version: "1.27.4"
    linux_amd64_sha256: 7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840
    linux_arm64_sha256: 3392582988a273a87ab5043ee1b2c9c17a2c3c00580bf9326c47a2e0aaaeac92
    source: https://go.dev/dl/
    install_script: scanners/install/go-tools.sh
  nodejs:
    major: "26"
    source: https://deb.nodesource.com/setup_26.x
    dockerfile: scanners/Dockerfile
  python:
    package: python3
    source: debian:trixie
    dockerfile: scanners/Dockerfile
  ruby:
    package: ruby
    source: debian:trixie
    dockerfile: scanners/Dockerfile
  php:
    package: php-cli
    source: debian:trixie
    dockerfile: scanners/Dockerfile
  jdk:
    package: openjdk-21-jdk-headless
    source: debian:trixie
    dockerfile: scanners/Dockerfile.jvm
  rust:
    version_variable: RUST_TOOLCHAIN
    bootstrap_version: "1.29.0"
    bootstrap_version_variable: RUSTUP_VERSION
    linux_amd64_sha256: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
    linux_amd64_sha256_variable: RUSTUP_LINUX_AMD64_SHA256
    linux_arm64_sha256: 9732d6c5e2a098d3521fca8145d826ae0aaa067ef2385ead08e6feac88fa5792
    linux_arm64_sha256_variable: RUSTUP_LINUX_ARM64_SHA256
    source: https://static.rust-lang.org/rustup/archive/
    install_script: scanners/install/rust.sh
