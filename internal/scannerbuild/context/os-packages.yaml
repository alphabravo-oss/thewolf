# Scanner operating-system package policy.
#
# Package versions are intentionally absent here. The explicit
# `scannertools os-packages --refresh --snapshot ...` operation resolves these
# names against immutable Debian snapshots (and exact external .deb artifacts)
# and writes os-packages.lock.yaml plus Docker-consumable pin files.
schemaVersion: wolf.scanners/os-package-policy/v1
repositories:
  debian:
    type: debian_snapshot
    uri: https://snapshot.debian.org/archive/debian
    suite: trixie
    component: main
  debian-security:
    type: debian_snapshot
    uri: https://snapshot.debian.org/archive/debian-security
    suite: trixie-security
    component: main
  nodesource:
    type: apt_artifact
    uri: https://deb.nodesource.com/node_22.x
    suite: nodistro
    component: main
variants:
  fixer-base:
    dockerfile: fixer/Dockerfile.base
    platforms:
      - linux/amd64
      - linux/arm64
    packages:
      debian:
        - build-essential
        - ca-certificates
        - curl
        - git
        - gzip
        - jq
        - openssh-client
        - pkg-config
        - python3
        - python3-venv
        - tar
        - unzip
        - xz-utils
      nodesource:
        - nodejs
  codeql:
    dockerfile: scanners/Dockerfile.codeql
    platforms:
      - linux/amd64
    packages:
      debian:
        - ca-certificates
        - curl
        - git
        - unzip
  default:
    dockerfile: scanners/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    packages:
      debian:
        - build-essential
        - ca-certificates
        - cppcheck
        - curl
        - git
        - gnupg
        - gzip
        - jq
        - libffi-dev
        - libssl-dev
        - php-cli
        - pkg-config
        - python3
        - python3-dev
        - python3-pip
        - python3-venv
        - ruby
        - ruby-dev
        - shellcheck
        - tar
        - unzip
        - wget
        - xz-utils
      nodesource:
        - nodejs
  jvm:
    dockerfile: scanners/Dockerfile.jvm
    platforms:
      - linux/amd64
      - linux/arm64
    packages:
      debian:
        - ca-certificates
        - curl
        - openjdk-21-jdk-headless
        - tar
        - unzip
        - xz-utils
  min:
    dockerfile: scanners/Dockerfile.min
    platforms:
      - linux/amd64
      - linux/arm64
    packages:
      debian:
        - ca-certificates
        - curl
        - python3
        - python3-pip
        - python3-venv
  rust:
    dockerfile: scanners/Dockerfile.rust
    platforms:
      - linux/amd64
      - linux/arm64
    packages:
      debian:
        - build-essential
        - ca-certificates
        - curl
        - libssl-dev
        - pkg-config
