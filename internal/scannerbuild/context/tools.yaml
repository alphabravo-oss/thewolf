# Scanner tool manifest.
#
# This is the scanner metadata source of truth. The plugin registry remains
# authoritative for executable behavior; this manifest owns version, image tier,
# image routing, and update-source metadata.
tools:
  bandit:
    display_name: Bandit
    category: sast
    resource_class: medium
    default_timeout: 10m
    plugin_package: plugins/python
    integration_tier: default
    pinned_version: "1.9.4"
    version_variable: BANDIT_VERSION
    install:
      manager: pip
      package: bandit
    update_source:
      type: pypi
      package: bandit
    smoke:
      command: ["bandit", "--version"]
      expected_pattern: "1.9.4"
  bearer:
    display_name: Bearer
    category: sast
    resource_class: heavy
    network_required: true
    default_timeout: 20m
