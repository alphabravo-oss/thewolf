services:
  wolf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${WOLF_VERSION:-dev}
        COMMIT: ${WOLF_COMMIT:-unknown}
        BUILD_DATE: ${WOLF_BUILD_DATE:-unknown}
    # Bind to 127.0.0.1 by default so the API isn't exposed on a
    # public interface unless the operator explicitly overrides
    # WOLF_BIND (KICS d6355c88 / 1c1325ff). Override with
    # WOLF_BIND=0.0.0.0 for a deployment that fronts wolf behind
    # a reverse proxy on a non-localhost interface.
    ports:
      - "${WOLF_BIND:-127.0.0.1}:${WOLF_PORT:-8778}:8778"
    # Drop all Linux capabilities (KICS 451d79dc), keep only what
    # wolf needs to write its sqlite db and spawn child scanners
    # via the mounted docker socket (no extra caps required).
    cap_drop:
      - ALL
    # Prevent privilege escalation inside the container — child
    # processes can't gain new privs via setuid/setgid binaries
    # (KICS 610e266e). The docker-socket mount is the real risk
    # vector here; this hardens the surrounding container.
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem (KICS ce76b7d0). Wolf writes only
    # to /home/wolf/.wolf (the data volume below) and /tmp (which
    # tmpfs covers via volumes).
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - wolf-data:/home/wolf/.wolf
      # Mount the docker socket so wolf-slim can spawn scanner containers
      # (Docker-out-of-Docker pattern). See PLAN.md §10.1 for security posture.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the host repos root read-only. Repos that wolf scans must live
      # under this path. WOLF_REPOS_ROOT defaults to ./repos relative to the
      # compose file. WOLF_HOST_REPOS_ROOT is what wolf-slim tells the docker
      # daemon (same as the source side of the bind, since the daemon sees
      # the host filesystem). They diverge in non-compose deployments.
      - ${WOLF_REPOS_ROOT:-./repos}:/repos:ro
    environment:
      - WOLF_MASTER_KEY=${WOLF_MASTER_KEY:-}
      # First-run admin. Bootstrapped only when BOTH are set and no user with
      # that email exists yet. Set these in your .env (see .env.example) so the
      # first `docker compose up` has a login. Leave the password empty to skip
      # bootstrap and use self-service registration instead.
      - WOLF_ADMIN_EMAIL=${WOLF_ADMIN_EMAIL:-admin@wolf.local}
      - WOLF_ADMIN_PASSWORD=${WOLF_ADMIN_PASSWORD:-}
      - WOLF_DB_DRIVER=${WOLF_DB_DRIVER:-sqlite}
      - WOLF_DB_DSN=${WOLF_DB_DSN:-}
      - WOLF_LOG_LEVEL=${WOLF_LOG_LEVEL:-info}
      # Scanner image references (per-bucket; Option B from PLAN.md §5.1).
      # WOLF_SCANNERS_TAG defaults to a release tag instead of :latest so
      # deployments are reproducible unless the operator opts into a float.
      - WOLF_SCANNERS_TAG=${WOLF_SCANNERS_TAG:-2.0.0}
      - WOLF_SCANNERS_IMAGE=${WOLF_SCANNERS_IMAGE:-alphabravodevops/wolf-scanners:${WOLF_SCANNERS_TAG:-2.0.0}}
      - WOLF_SCANNERS_IMAGE_JVM=${WOLF_SCANNERS_IMAGE_JVM:-alphabravodevops/wolf-scanners-jvm:${WOLF_SCANNERS_TAG:-2.0.0}}
      - WOLF_SCANNERS_IMAGE_RUST=${WOLF_SCANNERS_IMAGE_RUST:-alphabravodevops/wolf-scanners-rust:${WOLF_SCANNERS_TAG:-2.0.0}}
      - WOLF_SCANNERS_IMAGE_CODEQL=${WOLF_SCANNERS_IMAGE_CODEQL:-alphabravodevops/wolf-scanners-codeql:${WOLF_SCANNERS_TAG:-2.0.0}}
      - WOLF_SCANNERS_PULL_POLICY=${WOLF_SCANNERS_PULL_POLICY:-IfNotPresent}
      - WOLF_SCANNERS_NETWORK=${WOLF_SCANNERS_NETWORK:-bridge}
      - WOLF_SCANNERS_MEMORY=${WOLF_SCANNERS_MEMORY:-2g}
      - WOLF_SCANNERS_CPUS=${WOLF_SCANNERS_CPUS:-1.5}
      # Vuln-DB cache shared across scanner runs. Must be a HOST path (not a
      # named docker volume) — scanner containers run as the host user UID/GID
      # to read repo files, and a named volume's default root-owned perms
      # would block writes to /var/lib/wolf-db. See
      # internal/setup/scanners/scanners.go:78-84 for the rationale.
      - WOLF_SCANNERS_DB_VOLUME=${WOLF_SCANNERS_DB_VOLUME:-${HOME}/.wolf/scanner-cache}
      # Tell wolf-slim what host path /repos maps to on the daemon. In a
      # compose deployment this is the absolute resolution of WOLF_REPOS_ROOT.
      - WOLF_HOST_REPOS_ROOT=${WOLF_HOST_REPOS_ROOT:-${WOLF_REPOS_ROOT:-./repos}}
      - WOLF_IN_CONTAINER_REPOS_ROOT=/repos
      # Allow the "Add local repo → Browse…" picker to walk the read-only
      # repos bind. Defaults to /repos so the UI sees the same tree the
      # scanner does; override to expose additional roots if you mount more.
      - WOLF_BROWSE_ROOTS=${WOLF_BROWSE_ROOTS:-/repos}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - wolf-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wolf", "version"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:16-alpine
    # Pull the password from a docker secret rather than baking the
    # literal env. POSTGRES_PASSWORD_FILE is honored by the official
    # postgres image. For local dev a sane default still lands at
    # the named secret below (created lazily from POSTGRES_PASSWORD).
    # Operators in real environments set the secret via docker
    # secret create or compose secrets: { external: true } — never
    # commit the value (KICS 487f4be7).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wolf}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-wolf}
    secrets:
      - postgres_password
    # Bind to 127.0.0.1 so postgres isn't reachable from outside the
    # host (KICS d6355c88).
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    cap_drop:
      - ALL
    cap_add:
      # postgres needs to chown the data dir on first init.
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - wolf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wolf}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    profiles:
      - postgres

networks:
  wolf-net:
    driver: bridge

volumes:
  wolf-data:
  pg-data:

# Compose secrets — the postgres password lands here on dev machines
# via the POSTGRES_PASSWORD env (compose substitutes into the file at
# create time). In production, the operator should switch to:
#   external: true
# and provision the secret via `docker secret create postgres_password ...`.
secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
