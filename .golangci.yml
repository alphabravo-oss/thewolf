# golangci-lint v2 (required by golangci-lint-action v7).
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (io.Writer).Write
        - (*os.File).Close
        - (*gzip.Reader).Close
        - (*http.Response).Body.Close
        - (*sql.Rows).Close
        - (*sql.Tx).Rollback
        - (*sqlx.Rows).Close
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - os.MkdirAll
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fscanln
    staticcheck:
      checks:
        - all
        - "-QF*"
        - "-ST1005"
        - "-S1011"
        - "-S1017"
        - "-SA1019"
        - "-SA1012"
        - "-ST1000"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-SA4017"
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/scannerbuild/context/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocritic
          - unparam
          - bodyclose
      - path: _test\.go
        text: "dot-imports"
      - path: cmd/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
