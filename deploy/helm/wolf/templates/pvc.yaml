apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wolf.fullname" . }}-workspace
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.workspace.accessModes | nindent 4 }}
  {{- if .Values.workspace.storageClassName }}
  storageClassName: {{ .Values.workspace.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workspace.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wolf.fullname" . }}-artifacts
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.artifacts.accessModes | nindent 4 }}
  {{- if .Values.artifacts.storageClassName }}
  storageClassName: {{ .Values.artifacts.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.artifacts.size }}
{{- if eq (include "wolf.postgresMode" .) "bundled" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wolf.fullname" . }}-postgres
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.postgres.storageClassName }}
  storageClassName: {{ .Values.postgres.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
{{- end }}
{{- if .Values.fixer.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wolf.fullname" . }}-fixer-home
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.fixer.home.accessModes | nindent 4 }}
  {{- if .Values.fixer.home.storageClassName }}
  storageClassName: {{ .Values.fixer.home.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.fixer.home.size }}
{{- end }}
