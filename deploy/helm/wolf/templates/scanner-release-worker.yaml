apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wolf.fullname" . }}-scanner-release-proposal
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner-release-proposal
spec:
  replicas: {{ .Values.scannerRelease.proposal.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scanner-release-proposal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wolf
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scanner-release-proposal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proposal
          image: {{ required "scannerRelease.proposal.image is required when proposal is enabled" .Values.scannerRelease.proposal.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - scanner-release-worker
            - --role=proposal
            - --proposal-executor={{ required "scannerRelease.proposal.executorPath is required when proposal is enabled" .Values.scannerRelease.proposal.executorPath }}
            - --proposal-executor-max-output={{ printf "%d" (int .Values.scannerRelease.proposal.maxOutputBytes) }}
            - --proposal-poll={{ .Values.scannerRelease.proposal.pollInterval }}
            - --proposal-heartbeat={{ .Values.scannerRelease.proposal.heartbeatInterval }}
            - --proposal-lease-duration={{ .Values.scannerRelease.proposal.leaseDuration }}
            - --proposal-drain-timeout={{ .Values.scannerRelease.proposal.drainTimeout }}
            - --proposal-executor-env=GOMODCACHE
            - --proposal-executor-env=GOCACHE
            - --proposal-executor-env=GOPATH
            {{- range .Values.scannerRelease.proposal.executorArgs }}
            - {{ printf "--proposal-executor-arg=%s" . | quote }}
            {{- end }}
            {{- range .Values.scannerRelease.proposal.executorEnvironment }}
            - {{ printf "--proposal-executor-env=%s" .name | quote }}
            {{- end }}
          env:
            - {name: WOLF_DB_DRIVER, value: postgres}
            - {name: GOMODCACHE, value: /tmp/go-mod}
            - {name: GOCACHE, value: /tmp/go-cache}
            - {name: GOPATH, value: /tmp/go}
            - name: WOLF_DB_DSN
              valueFrom: {secretKeyRef: {name: {{ include "wolf.dbDSNSecretName" . }}, key: {{ include "wolf.dbDSNSecretKey" . }}}}
            {{- with .Values.scannerRelease.proposal.executorEnvironment }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.scannerRelease | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
{{- end }}
