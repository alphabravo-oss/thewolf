{{- if .Values.scannerRelease.scheduler.enabled }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wolf.fullname" . }}-scanner-release-scheduler
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scanner-release-scheduler
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- include "wolf.postgres5432Egress" . | nindent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wolf.fullname" . }}-scanner-release-scheduler
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner-release-scheduler
spec:
  replicas: {{ .Values.scannerRelease.scheduler.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scanner-release-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wolf
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scanner-release-scheduler
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: scheduler
          image: {{ include "wolf.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["scanner-release-worker", "--role=scheduler"]
          env:
            - {name: WOLF_DB_DRIVER, value: postgres}
            - name: WOLF_DB_DSN
              valueFrom: {secretKeyRef: {name: {{ include "wolf.dbDSNSecretName" . }}, key: {{ include "wolf.dbDSNSecretKey" . }}}}
            - {name: WOLF_SCANNER_DEFINITION_COMMIT, value: {{ required "scannerRelease.scheduler.definitionCommit is required" .Values.scannerRelease.scheduler.definitionCommit | quote }}}
            - {name: WOLF_SCANNER_RELEASE_TIMEZONE, value: {{ .Values.scannerRelease.scheduler.timezone | quote }}}
            - {name: WOLF_SCANNER_RELEASE_DAILY_TIME, value: {{ .Values.scannerRelease.scheduler.dailyTime | quote }}}
            - {name: WOLF_SCANNER_RELEASE_WEEKLY_TIME, value: {{ .Values.scannerRelease.scheduler.weeklyTime | quote }}}
            - {name: WOLF_SCANNER_RELEASE_WEEKLY_DAY, value: {{ .Values.scannerRelease.scheduler.weeklyDay | quote }}}
            - {name: WOLF_SCANNER_RELEASE_POLICY_SCOPE, value: {{ .Values.scannerRelease.scheduler.policyScope | quote }}}
          resources:
            {{- toYaml .Values.resources.scannerRelease | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
{{- end }}
{{- if .Values.scannerRelease.discovery.enabled }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wolf.fullname" . }}-scanner-release-discovery
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scanner-release-discovery
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: TCP, port: 443}
    {{- include "wolf.postgres5432Egress" . | nindent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wolf.fullname" . }}-scanner-release-discovery
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner-release-discovery
spec:
  replicas: {{ .Values.scannerRelease.discovery.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scanner-release-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wolf
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scanner-release-discovery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: discovery
          image: {{ include "wolf.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - scanner-release-worker
            - --role=discovery
            - --definition-commit={{ required "scannerRelease.discovery.definitionCommit is required" .Values.scannerRelease.discovery.definitionCommit }}
            - --discovery-manifest={{ .Values.scannerRelease.discovery.manifestPath }}
            - --discovery-lock={{ .Values.scannerRelease.discovery.lockPath }}
            - --discovery-max-concurrency={{ .Values.scannerRelease.discovery.maxConcurrency }}
            - --discovery-per-host-concurrency={{ .Values.scannerRelease.discovery.perHostConcurrency }}
            - --discovery-item-timeout={{ .Values.scannerRelease.discovery.itemTimeout }}
            - --discovery-source-attempts={{ .Values.scannerRelease.discovery.sourceAttempts }}
          env:
            - {name: WOLF_DB_DRIVER, value: postgres}
            - name: WOLF_DB_DSN
              valueFrom: {secretKeyRef: {name: {{ include "wolf.dbDSNSecretName" . }}, key: {{ include "wolf.dbDSNSecretKey" . }}}}
          resources:
            {{- toYaml .Values.resources.scannerRelease | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.scannerRelease.discovery.existingConfigMap }}
            - {name: scanner-definitions, mountPath: {{ dir .Values.scannerRelease.discovery.manifestPath | quote }}, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.scannerRelease.discovery.existingConfigMap }}
        - name: scanner-definitions
          configMap:
            name: {{ .Values.scannerRelease.discovery.existingConfigMap }}
            items:
              - {key: {{ .Values.scannerRelease.discovery.manifestKey }}, path: {{ base .Values.scannerRelease.discovery.manifestPath }}}
              - {key: {{ .Values.scannerRelease.discovery.lockKey }}, path: {{ base .Values.scannerRelease.discovery.lockPath }}}
        {{- end }}
---
{{- end }}
