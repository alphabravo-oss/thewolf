apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wolf.fullname" . }}-api
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wolf.workerServiceAccountName" . }}
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wolf.scannerServiceAccountName" . }}
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "wolf.fullname" . }}-scan-worker
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "wolf.fullname" . }}-scan-worker
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "wolf.workerServiceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "wolf.fullname" . }}-scan-worker
{{- if and .Values.scannerRelease.builder.enabled (or (eq .Values.scannerRelease.builder.backend "kubernetes-job") (eq .Values.scannerRelease.builder.backend "managed")) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wolf.scannerReleaseBuilderServiceAccountName" . }}
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "wolf.fullname" . }}-scanner-release-jobs
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "wolf.fullname" . }}-scanner-release-jobs
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "wolf.scannerReleaseBuilderServiceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "wolf.fullname" . }}-scanner-release-jobs
{{- end }}
{{- if and .Values.scannerRelease.builder.enabled (eq .Values.scannerRelease.builder.backend "managed") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wolf.scannerReleaseBuildkitServiceAccountName" . }}
  namespace: {{ .Values.scannerRelease.builder.managed.kubernetes.buildxNamespace }}
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "wolf.fullname" . }}-scanner-release-buildx
  namespace: {{ .Values.scannerRelease.builder.managed.kubernetes.buildxNamespace }}
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
rules:
  # docker/buildx's Kubernetes driver creates one operation-scoped BuildKit
  # controller and connects with pods/exec. It never receives cluster scope,
  # Secrets, Jobs, or access to the release namespace.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "wolf.fullname" . }}-scanner-release-buildx
  namespace: {{ .Values.scannerRelease.builder.managed.kubernetes.buildxNamespace }}
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "wolf.scannerReleaseBuilderServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "wolf.fullname" . }}-scanner-release-buildx
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wolf.scannerReleaseSignerServiceAccountName" . }}
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
  {{- with .Values.scannerRelease.signing.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wolf.scannerReleaseFixedServiceAccountName" . }}
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
  {{- with .Values.scannerRelease.builder.managed.adapters.fixed.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wolf.scannerReleaseQualityServiceAccountName" . }}
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
  {{- with .Values.scannerRelease.builder.managed.adapters.quality.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wolf.scannerReleaseIntegrationServiceAccountName" . }}
  labels:
    {{- include "wolf.labels" . | nindent 4 }}
  {{- with .Values.scannerRelease.builder.managed.adapters.integration.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
